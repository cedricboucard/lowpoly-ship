<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Low Poly Ship</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    
  <article class="main-container">
  <figure>
    <img src="ship.png" alt="Low poly 3D boat model, red roof, lantern lit, floating on blue water" class="ship-image">
  </figure>
  <header>
    <h1 class="title">Low Poly Ship</h1>
  </header>
  <p class="description">A low poly ship model created for demonstration purposes.</p>
  <ul class="properties">
    <li class="property">Blender 5.1 </li>
    <li class="property">Cycles </li>
    <li class="property">450 tris</li>
  </ul>
  <footer>
    <button class="action-button">View in 3D</button>
  </footer>
</article>

</body>
</html>
